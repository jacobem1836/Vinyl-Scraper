<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset your CRATE password</title>
</head>
<body style="margin:0; padding:0; background-color:#0a0a0a; -webkit-text-size-adjust:100%; -ms-text-size-adjust:100%;">
  <table border="0" cellpadding="0" cellspacing="0" width="100%" style="background-color:#0a0a0a; border-collapse:collapse;">
    <tr>
      <td align="center" style="padding:32px 16px;">
        <table border="0" cellpadding="0" cellspacing="0" width="600" style="max-width:600px; background-color:#111111; border-collapse:collapse; border:1px solid #222222;">

          <tr>
            <td align="center" style="background-color:#0d0b0a; padding:28px 40px 24px 40px; border-bottom:1px solid #222222;">
              <a href="{{ app_url }}" style="font-family:Georgia,'Times New Roman',serif; font-size:24px; font-weight:700; color:#ffffff; letter-spacing:8px; text-transform:uppercase; text-decoration:none;">CRATE</a>
            </td>
          </tr>

          <tr>
            <td style="padding:32px 40px 8px 40px;">
              <h1 style="margin:0 0 12px 0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size:22px; font-weight:700; color:#ffffff; line-height:1.3;">Reset your password</h1>
              <p style="margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size:15px; color:#c9c9c9; line-height:1.6;">
                Use the link below to set a new password. It expires in one hour and can only be used once.
              </p>
            </td>
          </tr>

          <tr>
            <td style="padding:24px 40px 8px 40px;">
              <table border="0" cellpadding="0" cellspacing="0" style="border-collapse:collapse;">
                <tr>
                  <td align="center" bgcolor="#ffffff" style="border-radius:2px;">
                    <a href="{{ link }}" style="display:inline-block; padding:14px 28px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size:15px; font-weight:600; color:#0d0b0a; text-decoration:none;">Set a new password</a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <tr>
            <td style="padding:16px 40px 32px 40px;">
              <p style="margin:0 0 6px 0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size:12px; color:#8a8a8a;">Or paste this into your browser:</p>
              <p style="margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size:12px; color:#8a8a8a; word-break:break-all; line-height:1.5;">{{ link }}</p>
            </td>
          </tr>

          <tr>
            <td align="center" style="background-color:#0a0a0a; padding:24px 40px; border-top:1px solid #222222;">
              <p style="margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size:11px; color:#8a8a8a; line-height:1.6;">
                If you did not ask for this, ignore the email. Your password stays as it is.
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
