{# Add-item modal. Included once from base.html so the nav "Add Item" button works on every page. #}
<div id="addItemModal" class="hidden modal-overlay" role="dialog" aria-modal="true"
     aria-labelledby="addItemModalTitle" data-typeahead-prefix="add">
  <div data-backdrop class="modal-backdrop opacity-0"></div>
  <div class="modal-center">
    <div data-panel class="modal-panel opacity-0 translate-y-4">
      <h2 id="addItemModalTitle" class="section-heading" style="margin-bottom: var(--space-md);">Add to your crate</h2>

      <form action="/wishlist/add" method="post" class="stack-md">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div>
          <label class="form-label" for="addQuery">What are you looking for?</label>
          <div class="typeahead-wrapper">
            <input id="addQuery" name="query" required placeholder="e.g. Nick Cave — The Boatman's Call" class="form-input"
                   role="combobox" aria-expanded="false" aria-haspopup="listbox" aria-autocomplete="list"
                   aria-controls="add-typeahead-listbox" autocomplete="off">
            <div id="addSpinner" class="typeahead-spinner hidden" aria-hidden="true"></div>
            <div id="add-typeahead-listbox" class="typeahead-dropdown" role="listbox" aria-label="Discogs matches"></div>
          </div>
          <input type="hidden" id="addDiscogsReleaseId" name="discogs_release_id" value="">
        </div>

        <div>
          <label class="form-label" for="addType">Type</label>
          <select id="addType" name="type" class="form-input">
            <option value="album" selected>Album</option>
            <option value="artist">Artist</option>
            <option value="label">Label</option>
            <option value="subject">Key word/s</option>
          </select>
        </div>

        <div>
          <label class="form-label" for="addNotes">Notes (optional)</label>
          <input id="addNotes" name="notes" placeholder="Pressing, colour, condition…" class="form-input">
        </div>

        <div>
          <label class="form-label" for="addNotifyPct">Alert me when a listing is this % below typical</label>
          <input id="addNotifyPct" name="notify_below_pct" step="1" min="1" max="90" type="number" value="20" class="form-input">
        </div>

        <label class="flex items-center gap-sm text-muted text-label" for="addNotifyEmail">
          <input type="hidden" name="notify_email" value="">
          <input id="addNotifyEmail" type="checkbox" name="notify_email" checked class="form-checkbox">
          Email me when deals are found
        </label>

        <div class="flex justify-end gap-sm" style="padding-top: var(--space-sm);">
          <button type="button" data-close-modal class="btn-secondary">Cancel</button>
          <button type="submit" class="btn-cta">Add to crate</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    var modal = document.getElementById('addItemModal');
    var openBtn = document.getElementById('openAddItemBtn');
    if (openBtn && modal) {
      openBtn.addEventListener('click', function () { window.CrateModal.open(modal, openBtn); });
    }
    var typeSelect = document.getElementById('addType');
    if (typeSelect && typeof initTypeahead === 'function') initTypeahead('add', typeSelect);
  });
</script>
